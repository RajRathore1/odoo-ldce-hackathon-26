[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
testpaths = apps core
addopts = -q --reuse-db --no-migrations

# --no-migrations builds the test schema straight from the models. On SQLite that
# is several seconds faster per run, and it means a teammate mid-migration does
# not break everyone else's tests. Drop the flag if you need to test a migration.
